name: Actualizar datos del embudo

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer datos de HubSpot y LinkedIn PACS
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python3 scripts/fetch_data.py

      - name: Guardar cambios si hay datos nuevos
        run: |
          git config user.name "xsell-embudo-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/funnel.json; then
            git add data/funnel.json
            git commit -m "Actualizar datos del embudo ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "Sin cambios en los datos."
          fi
