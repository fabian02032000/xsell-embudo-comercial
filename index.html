<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Embudo Comercial · Xsell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f12;
    --panel:#17171c;
    --panel-2:#1e1e25;
    --border:#2a2a33;
    --text:#f4f4f6;
    --text-muted:#9a9aa5;
    --text-faint:#6b6b76;

    --comercial:#8b5cf6;
    --comercial-bg:rgba(139,92,246,.12);
    --mkt:#ea580c;
    --mkt-bg:rgba(234,88,12,.12);
    --linkedin:#3b82f6;
    --linkedin-bg:rgba(59,130,246,.12);
    --total:#16a34a;
    --total-bg:rgba(22,163,74,.12);

    --stage1:#7c3aed;
    --stage2:#ea580c;
    --stage3:#d97706;
    --stage4:#16a34a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 64px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    margin-bottom:20px;
  }
  h1{font-size:19px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px;}
  h1 .ico{font-size:18px;}
  .live{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--total);box-shadow:0 0 0 3px var(--total-bg);}
  .dot.stale{background:#eab308;box-shadow:0 0 0 3px rgba(234,179,8,.15);}
  .dot.err{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15);}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }

  .month-label{font-size:11.5px;font-weight:600;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    border:1.5px solid var(--border);
    background:transparent;
    color:var(--text-muted);
    padding:7px 16px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:all .12s ease;
  }
  .pill:hover{border-color:#3d3d48;color:var(--text);}
  .pill.active{background:var(--text);color:#0f0f12;border-color:var(--text);}

  .cal-picker{position:relative;display:inline-block;}
  .cal-trigger{
    display:inline-flex;align-items:center;gap:8px;
    border:1.5px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:border-color .12s ease;
  }
  .cal-trigger:hover{border-color:#3d3d48;}
  .cal-trigger .cal-ico{font-size:15px;}
  .cal-trigger .cal-chevron{color:var(--text-faint);font-size:11px;margin-left:2px;}
  .cal-popup{
    position:absolute;top:calc(100% + 8px);left:0;z-index:20;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    width:280px;
    box-shadow:0 12px 32px rgba(0,0,0,.45);
    display:none;
  }
  .cal-popup.open{display:block;}
  .cal-popup-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-popup-head span{font-size:14px;font-weight:700;}
  .cal-nav{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;
  }
  .cal-nav:hover{border-color:#3d3d48;}
  .cal-nav:disabled{opacity:.3;cursor:default;}
  .cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .cal-cell{
    border:1.5px solid var(--border);
    background:transparent;
    color:var(--text-muted);
    padding:9px 0;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:all .12s ease;
  }
  .cal-cell:hover:not(:disabled){border-color:#3d3d48;color:var(--text);}
  .cal-cell.active{background:var(--text);color:#0f0f12;border-color:var(--text);}
  .cal-cell:disabled{opacity:.28;cursor:default;}

  .fuente-pill{
    border:1.5px solid var(--border);
    background:transparent;
    padding:6px 14px 6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:var(--text-muted);
    transition:all .12s ease;
  }
  .fuente-pill .sw{width:8px;height:8px;border-radius:50%;}
  .fuente-pill[data-f="Comercial"]{border-color:var(--comercial);}
  .fuente-pill[data-f="MKT Pauta"]{border-color:var(--mkt);}
  .fuente-pill[data-f="LinkedIn PACS"]{border-color:var(--linkedin);}
  .fuente-pill[data-f="Total"]{border-color:var(--total);}
  .fuente-pill.active[data-f="Comercial"]{background:var(--comercial-bg);color:var(--comercial);}
  .fuente-pill.active[data-f="MKT Pauta"]{background:var(--mkt-bg);color:var(--mkt);}
  .fuente-pill.active[data-f="LinkedIn PACS"]{background:var(--linkedin-bg);color:var(--linkedin);}
  .fuente-pill.active[data-f="Total"]{background:var(--total-bg);color:var(--total);}

  .funnel-title{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;
  }
  .funnel-title h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;font-weight:700;}

  .stage{
    display:grid;
    grid-template-columns:230px repeat(4, 1fr);
    gap:10px;
    align-items:stretch;
    margin-bottom:10px;
  }
  .stage:last-child{margin-bottom:0;}
  .stage-head{
    border-radius:10px;
    padding:14px 16px;
    display:flex;flex-direction:column;justify-content:center;gap:2px;
    color:#fff;
  }
  .stage-head .nm{font-weight:700;font-size:14.5px;}
  .stage-head .meta{font-size:11.5px;opacity:.85;}
  .stage[data-stage="0"] .stage-head{background:linear-gradient(135deg,var(--stage1),#5b21b6);}
  .stage[data-stage="1"] .stage-head{background:linear-gradient(135deg,var(--stage2),#9a3412);}
  .stage[data-stage="2"] .stage-head{background:linear-gradient(135deg,var(--stage3),#92400e);}
  .stage[data-stage="3"] .stage-head{background:linear-gradient(135deg,var(--stage4),#166534);}

  .cell{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 10px;
    display:flex;flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    position:relative;
  }
  .cell .n{font-size:22px;font-weight:800;line-height:1;}
  .cell .lbl{font-size:10.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .cell .bar-track{width:100%;height:4px;border-radius:2px;background:#2a2a33;overflow:hidden;margin-top:2px;}
  .cell .bar-fill{height:100%;border-radius:2px;}
  .cell[data-f="Comercial"] .n{color:var(--comercial);}
  .cell[data-f="MKT Pauta"] .n{color:var(--mkt);}
  .cell[data-f="LinkedIn PACS"] .n{color:var(--linkedin);}
  .cell[data-f="Total"] .n{color:var(--total);}
  .cell[data-f="Comercial"] .bar-fill{background:var(--comercial);}
  .cell[data-f="MKT Pauta"] .bar-fill{background:var(--mkt);}
  .cell[data-f="LinkedIn PACS"] .bar-fill{background:var(--linkedin);}
  .cell[data-f="Total"] .bar-fill{background:var(--total);}

  @media (max-width:820px){
    .stage{grid-template-columns:1fr 1fr;}
    .stage-head{grid-column:1 / -1;}
  }

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--text-faint);font-weight:700;padding:0 10px 10px;border-bottom:1px solid var(--border);
  }
  tbody td{padding:10px;border-bottom:1px solid var(--border);}
  tbody tr:last-child td{border-bottom:none;}
  .tag{
    display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
  }
  .tag .sw{width:6px;height:6px;border-radius:50%;}
  .status{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#26262f;color:var(--text-muted);}
  .status.descartada{background:rgba(239,68,68,.12);color:#f87171;}
  .status.standby{background:rgba(234,179,8,.12);color:#facc15;}
  .status.ganado{background:rgba(22,163,74,.12);color:#4ade80;}
  .grupo-th td{
    padding:12px 10px 8px;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--text-muted);
    background:var(--panel-2);
  }
  .grupo-th:first-child td{border-top:none;}
  .grupo-th .grupo-count{
    font-weight:600;
    color:var(--text-faint);
    text-transform:none;
    letter-spacing:0;
    margin-left:6px;
  }

  .empty{color:var(--text-faint);font-size:13.5px;padding:20px 0;text-align:center;}
  .foot{color:var(--text-faint);font-size:12px;text-align:center;margin-top:24px;line-height:1.6;}
  .foot a{color:var(--text-muted);}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1><span class="ico">📊</span> Embudo Comercial · Xsell</h1>
    <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">Cargando…</span></div>
  </header>

  <div class="card">
    <div class="month-label">Seleccionar mes</div>
    <div class="cal-picker" id="calPicker">
      <button class="cal-trigger" id="calTrigger" type="button">
        <span class="cal-ico">📅</span>
        <span id="calTriggerLabel">—</span>
        <span class="cal-chevron">▾</span>
      </button>
      <div class="cal-popup" id="calPopup">
        <div class="cal-popup-head">
          <button class="cal-nav" id="calPrevYear" type="button">‹</button>
          <span id="calYearLabel">—</span>
          <button class="cal-nav" id="calNextYear" type="button">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="funnel-title">
      <h2 id="funnelTitle">Embudo Comercial</h2>
      <div class="pill-row" id="fuenteRow"></div>
    </div>
    <div id="stages"></div>
  </div>

  <div class="card">
    <div class="funnel-title">
      <h2>Detalle por lead</h2>
    </div>
    <div id="detalleWrap"><div class="empty">Sin datos todavía.</div></div>
  </div>

  <div class="foot">
    Datos de HubSpot y del repo de LinkedIn PACS. Se actualiza solo cada 10 minutos.<br>
    <span id="genInfo"></span>
  </div>

</div>

<script>
const FUENTES = ["Comercial","MKT Pauta","LinkedIn PACS","Total"];
const NIVELES = [
  {key:"contactos", label:"Contactos / Leads"},
  {key:"reuniones", label:"Reuniones Agendadas"},
  {key:"propuestas", label:"Propuestas Enviadas"},
  {key:"ventas", label:"Ventas Cerradas"},
];

let dataset = null;
let mesActual = null;
let fuenteActiva = "Total"; // solo afecta el filtro del detalle

function metaDe(metas, nivelKey, fuente){
  const m = metas[nivelKey];
  if (typeof m === "number") return fuente === "Total" ? m*3 : m; // reuniones/propuestas: meta total del equipo
  if (!m) return null;
  if (fuente === "Total") return Object.values(m).reduce((a,b)=>a+b,0);
  return m[fuente] ?? null;
}

function pct(n, meta){
  if (!meta) return 0;
  return Math.max(0, Math.min(100, Math.round((n/meta)*100)));
}

const MESES_ABREV = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];
let calViewYear = null;

function renderMeses(){
  if (calViewYear === null && mesActual){
    calViewYear = Number(mesActual.split("-")[0]);
  }
  const label = document.getElementById("calTriggerLabel");
  if (mesActual) label.textContent = etiquetaMes(mesActual);
  renderCalGrid();
}

function renderCalGrid(){
  const meses = Object.keys(dataset.meses).sort();
  const anios = [...new Set(meses.map(m => Number(m.split("-")[0])))].sort((a,b)=>a-b);
  if (calViewYear === null) calViewYear = anios[anios.length-1];

  document.getElementById("calYearLabel").textContent = calViewYear;
  document.getElementById("calPrevYear").disabled = calViewYear <= anios[0];
  document.getElementById("calNextYear").disabled = calViewYear >= anios[anios.length-1];

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  for (let mo = 1; mo <= 12; mo++){
    const key = `${calViewYear}-${String(mo).padStart(2,"0")}`;
    const disponible = !!dataset.meses[key];
    const btn = document.createElement("button");
    btn.className = "cal-cell" + (key === mesActual ? " active" : "");
    btn.textContent = MESES_ABREV[mo-1];
    btn.disabled = !disponible;
    if (disponible){
      btn.onclick = ()=>{
        mesActual = key;
        document.getElementById("calPopup").classList.remove("open");
        renderAll();
      };
    }
    grid.appendChild(btn);
  }
}

function initCalendarEvents(){
  const trigger = document.getElementById("calTrigger");
  const popup = document.getElementById("calPopup");
  const picker = document.getElementById("calPicker");
  trigger.onclick = (e)=>{
    e.stopPropagation();
    popup.classList.toggle("open");
  };
  document.getElementById("calPrevYear").onclick = ()=>{ calViewYear--; renderCalGrid(); };
  document.getElementById("calNextYear").onclick = ()=>{ calViewYear++; renderCalGrid(); };
  document.addEventListener("click", (e)=>{
    if (!picker.contains(e.target)) popup.classList.remove("open");
  });
  document.addEventListener("keydown", (e)=>{
    if (e.key === "Escape") popup.classList.remove("open");
  });
}

function etiquetaMes(m){
  const [y,mo] = m.split("-").map(Number);
  const nombres = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"];
  return `${nombres[mo-1]} ${y}`;
}

function renderFuentePills(){
  const row = document.getElementById("fuenteRow");
  row.innerHTML = "";
  FUENTES.forEach(f=>{
    const b = document.createElement("button");
    b.className = "fuente-pill" + (f === fuenteActiva ? " active" : "");
    b.dataset.f = f;
    b.innerHTML = `<span class="sw" style="background:${colorDe(f)}"></span>${f}`;
    b.onclick = ()=>{ fuenteActiva = f; renderAll(); };
    row.appendChild(b);
  });
}

function colorDe(f){
  return {
    "Comercial":"#8b5cf6","MKT Pauta":"#ea580c","LinkedIn PACS":"#3b82f6","Total":"#16a34a"
  }[f];
}

function datosDelMes(m){
  const mes = dataset.meses[m];
  const fuentesConTotal = {...mes.fuentes};
  fuentesConTotal["Total"] = mes.total;
  return {fuentes: fuentesConTotal, metas: mes.metas, detalle: mes.detalle};
}

function renderStages(){
  const cont = document.getElementById("stages");
  cont.innerHTML = "";
  if (!mesActual){ cont.innerHTML = '<div class="empty">Sin datos todavía.</div>'; return; }
  const {fuentes, metas} = datosDelMes(mesActual);

  NIVELES.forEach((nivel, idx)=>{
    const row = document.createElement("div");
    row.className = "stage";
    row.dataset.stage = idx;

    const head = document.createElement("div");
    head.className = "stage-head";
    const metaTotal = metaDe(metas, nivel.key, "Total");
    head.innerHTML = `<div class="nm">${nivel.label}</div><div class="meta">${metaTotal!=null ? "Meta: "+metaTotal : ""}</div>`;
    row.appendChild(head);

    FUENTES.forEach(f=>{
      const n = fuentes[f] ? fuentes[f][nivel.key] : 0;
      const meta = metaDe(metas, nivel.key, f);
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.f = f;
      cell.innerHTML = `
        <div class="n">${n}</div>
        <div class="lbl">${f}${meta!=null ? " · de "+meta : ""}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct(n,meta)}%"></div></div>
      `;
      row.appendChild(cell);
    });

    cont.appendChild(row);
  });
}

function statusClass(etapa){
  const e = (etapa||"").toLowerCase();
  if (e.includes("descartad")) return "descartada";
  if (e.includes("stand by")) return "standby";
  if (e.includes("implementad") || e.includes("won")) return "ganado";
  return "";
}

const NIVEL_DETALLE_ORDEN = ["Contactos","Reuniones Agendadas","Propuestas Enviadas","Ventas Cerradas","Fuera del embudo"];
const NIVEL_DETALLE_COLOR = {
  "Contactos":"#7c3aed",
  "Reuniones Agendadas":"#ea580c",
  "Propuestas Enviadas":"#d97706",
  "Ventas Cerradas":"#16a34a",
  "Fuera del embudo":"#64748b",
};

function renderDetalle(){
  const wrap = document.getElementById("detalleWrap");
  if (!mesActual){ wrap.innerHTML = '<div class="empty">Sin datos todavía.</div>'; return; }
  // Siempre del mes seleccionado: dataset.meses[mesActual] trae solo lo de ese mes.
  const {detalle} = datosDelMes(mesActual);
  const filtrado = fuenteActiva === "Total" ? detalle : detalle.filter(d=>d.fuente===fuenteActiva);

  if (!filtrado.length){
    wrap.innerHTML = '<div class="empty">No hay leads para este filtro todavía.</div>';
    return;
  }

  // Clasifica el embudo: agrupa cada lead segun en que nivel del embudo esta,
  // en vez de mostrar todos amontonados en una sola lista.
  const grupos = new Map();
  filtrado.forEach(d=>{
    const nivel = d.nivel || "Fuera del embudo";
    if (!grupos.has(nivel)) grupos.set(nivel, []);
    grupos.get(nivel).push(d);
  });

  let rows = "";
  NIVEL_DETALLE_ORDEN.forEach(nivel=>{
    const items = grupos.get(nivel);
    if (!items || !items.length) return;
    const color = NIVEL_DETALLE_COLOR[nivel] || "#64748b";
    rows += `
      <tr class="grupo-th">
        <td colspan="5" style="border-left:3px solid ${color}">
          ${nivel}<span class="grupo-count">· ${items.length}</span>
        </td>
      </tr>
    `;
    rows += items.map(d=>`
      <tr>
        <td><span class="tag" style="background:${colorDe(d.fuente)}22;color:${colorDe(d.fuente)}"><span class="sw" style="background:${colorDe(d.fuente)}"></span>${d.fuente}</span></td>
        <td>${d.contacto || "—"}</td>
        <td>${d.negocio || "—"}</td>
        <td><span class="status ${statusClass(d.etapa)}">${d.etapa}</span></td>
        <td style="color:var(--text-faint)">${d.origen}</td>
      </tr>
    `).join("");
  });

  wrap.innerHTML = `
    <table>
      <thead><tr><th>Fuente</th><th>Contacto</th><th>Negocio</th><th>Etapa actual</th><th>Origen</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderAll(){
  renderMeses();
  renderFuentePills();
  renderStages();
  renderDetalle();
}

function actualizarLive(ok, generado){
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("liveText");
  const gen = document.getElementById("genInfo");
  if (!ok){
    dot.className = "dot err";
    txt.textContent = "No se pudo actualizar";
    return;
  }
  const fecha = new Date(generado);
  const ahoraMin = (Date.now() - fecha.getTime())/60000;
  dot.className = "dot" + (ahoraMin > 20 ? " stale" : "");
  txt.textContent = "Actualizado " + fecha.toLocaleTimeString("es-PE", {hour:"2-digit", minute:"2-digit"});
  gen.textContent = "Última actualización: " + fecha.toLocaleString("es-PE");
}

async function cargar(){
  try{
    const res = await fetch("data/funnel.json?_=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const nuevo = await res.json();
    dataset = nuevo;
    if (!mesActual || !dataset.meses[mesActual]){
      const meses = Object.keys(dataset.meses).sort();
      mesActual = meses[meses.length-1];
    }
    renderAll();
    actualizarLive(true, dataset.generado);
  }catch(e){
    console.error(e);
    actualizarLive(false);
  }
}

initCalendarEvents();
cargar();
setInterval(cargar, 60000);
</script>
</body>
</html>
